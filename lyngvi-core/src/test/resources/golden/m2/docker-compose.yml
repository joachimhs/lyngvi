# Lyngvi shared stack: the egress proxy and (once built) the gateway.
# Rendered into ./docker-compose.yml by 'setup.sh rebuild-config'; do not edit the result.
# Agent containers are not services here; 'setup.sh session start' runs one per session.

services:
  proxy:
    image: docker.io/ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: sb-proxy
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro,z
      - ./proxy/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro,z
      - ./proxy/blocked-domains.txt:/etc/squid/blocked-domains.txt:ro,z
      - ./proxy/gateway-hosts.txt:/etc/squid/gateway-hosts.txt:ro,z
    # The proxy is the one that connects to a model server on the developer's own machine (profile.json localModels).
    extra_hosts:
      - "host.containers.internal:host-gateway"
    networks:
      internal:
        ipv4_address: 172.31.240.5
      external: {}
    mem_limit: ${PROXY_MEM_LIMIT:-512m}
    cpus: ${PROXY_CPU_LIMIT:-1.0}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3128"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
  gateway:
    build:
      context: ./gateway
      dockerfile: Containerfile
      args:
        USER_UID: 1234
        USER_GID: 5678
    image: localhost/lyngvi-gateway:{{VERSION}}
    container_name: sb-gateway
    userns_mode: "keep-id:uid=1234,gid=5678"
    environment:
      PORT: "8080"
      HTTP_ALT_PORT: "80"
      TLS_PORT: "443"
      TLS_CERT_FILE: /etc/gateway/certs/gateway.crt
      TLS_KEY_FILE: /etc/gateway/certs/gateway.key
      CA_CERT_DIR: /certs
      ALLOWLIST_DIR: /etc/gateway/allowlists
      ALLOWLIST_ENFORCED: "true"
      GATEWAY_MANIFEST: /etc/gateway/gateway.manifest.json
      PLUGIN_DIR: /app/plugins
      ALLOW_WRITE: ""
    volumes:
      - ./gateway/gateway.manifest.json:/etc/gateway/gateway.manifest.json:ro,z
      - ./gateway/allowlists:/etc/gateway/allowlists:ro,z
      - ./gateway/certs/gateway.crt:/etc/gateway/certs/gateway.crt:ro,z
      - ./gateway/certs/gateway.key:/etc/gateway/certs/gateway.key:ro,z
      - ./gateway/plugins:/app/plugins:ro,z
      - {{HOME}}/.cache/lyngvi/ca:/certs:ro,z
    networks:
      internal:
        ipv4_address: 172.31.240.10
      external: {}
    mem_limit: ${GATEWAY_MEM_LIMIT:-256m}
    cpus: ${GATEWAY_CPU_LIMIT:-1.0}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/opt/jre/bin/java", "-jar", "/app/gateway.jar", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/24
  external:
    driver: bridge
